name: Simpan Skor Cacing Inggris

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

jobs:
  save-score:
    if: startsWith(github.event.issue.title, '[CAW-LEADERBOARD]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and save leaderboard
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const get = (key) => {
              const match = body.match(new RegExp('^' + key + ':\\s*(.*)$', 'mi'));
              return match ? match[1].trim() : '';
            };

            const name = get('PLAYER_NAME').replace(/[<>]/g, '').slice(0, 24);
            const score = Number(get('SCORE'));
            const stage = Number(get('STAGE'));

            if (!name || !Number.isSafeInteger(score) || score < 0 ||
                !Number.isInteger(stage) || stage < 1 || stage > 10) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'Skor tidak dapat diproses karena format data tidak valid.'
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                state: 'closed'
              });
              return;
            }

            const fs = require('fs');
            const path = 'leaderboard.json';
            let data = { updatedAt: null, scores: [] };
            if (fs.existsSync(path)) {
              try { data = JSON.parse(fs.readFileSync(path, 'utf8')); } catch (_) {}
            }
            if (!Array.isArray(data.scores)) data.scores = [];

            // Satu pengiriman hanya diproses sekali berdasarkan nomor issue.
            if (data.scores.some(item => item.issueNumber === issue.number)) return;

            data.scores.push({
              player: name,
              score,
              stage,
              githubUser: issue.user.login,
              issueNumber: issue.number,
              submittedAt: new Date().toISOString()
            });
            data.scores.sort((a, b) => b.score - a.score || b.stage - a.stage);
            data.scores = data.scores.slice(0, 100);
            data.updatedAt = new Date().toISOString();
            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              message: 'Update leaderboard Cacing Inggris',
              content: Buffer.from(fs.readFileSync(path)).toString('base64'),
              sha: (await github.rest.repos.getContent({ ...context.repo, path }).catch(() => ({data:{sha:undefined}}))).data.sha
            }).catch(async (error) => {
              if (error.status !== 404) throw error;
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo,
                path,
                message: 'Buat leaderboard Cacing Inggris',
                content: Buffer.from(fs.readFileSync(path)).toString('base64')
              });
            });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: 'Skor berhasil masuk ke leaderboard Cacing Inggris. Terima kasih sudah bermain!'
            });
            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              state: 'closed'
            });
